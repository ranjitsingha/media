name: Build Media3 AARs

on:
  push:
    branches:
      - build-mediastore
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Media3
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Media3
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build and Publish to Maven Repository
        run: |
          ./gradlew publishReleasePublicationToMavenRepository \
            -PmavenRepo="${{ github.workspace }}/repo" \
            -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=1g" \
            -x test -x lint -x check \
            --stacktrace --no-daemon

      - name: Verify Built Artifacts
        run: |
          echo "=== Maven Repository ==="
          ls -la repo/ || true
          find repo/ -type f || true

      - name: Upload Local Maven Repository
        uses: actions/upload-artifact@v4
        with:
          name: media3-maven-repo
          path: repo/

      - name: Upload AAR Files
        uses: actions/upload-artifact@v4
        with:
          name: media3-aars
          path: |
            **/outputs/aar/*.aar
            **/*.aar
